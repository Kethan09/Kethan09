data_dir: data
account_balance: 100000.0
allowlist:
  - xauusd
  - nas100
  - us30
symbol_map:
  xauusd: ["XAUUSD", "GOLD"]
  audusd: ["AUDUSD"]
  eurusd: ["EURUSD"]
  gbpusd: ["GBPUSD"]
  nzdusd: ["NZDUSD"]
  eurjpy: ["EURJPY"]
  gbpjpy: ["GBPJPY"]
  usdcad: ["USDCAD"]
  usdjpy: ["USDJPY"]
  nas100: ["NAS100", "USTEC", "US100"]
  us30: ["US30", "DJ30", "US30.cash"]
  dxy: ["DXY", "USDX", "DOLLAR"]
